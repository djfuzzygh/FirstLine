<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHS Clinical Data Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        textarea::placeholder {
            color: #64748b;
        }

        .btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 14px;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .result-item {
            background: rgba(16, 185, 129, 0.1);
            border-left: 3px solid #10b981;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .result-item.error {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: #ef4444;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .result-meta {
            font-size: 12px;
            color: #94a3b8;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-badge.success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-badge.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏥 NHS Clinical Data Scraper</h1>
        <p class="subtitle">Paste NHS Inform URLs to extract clinical data and auto-populate the knowledge base</p>

        <div class="card">
            <label for="urls">NHS Inform URLs (one per line):</label>
            <textarea id="urls" placeholder="https://www.nhsinform.scot/illnesses-and-conditions/infections-and-poisoning/meningitis/
https://www.nhsinform.scot/illnesses-and-conditions/lungs-and-airways/pneumonia/
..."></textarea>

            <button class="btn" id="scrapeBtn" onclick="startScraping()">
                🚀 Start Scraping
            </button>

            <div class="progress" id="progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Processing...</div>
            </div>
        </div>

        <div class="results" id="results">
            <h2>Results</h2>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        async function startScraping() {
            const urlsText = document.getElementById('urls').value;
            const urls = urlsText.split('\n').filter(u => u.trim().length > 0);

            if (urls.length === 0) {
                alert('Please paste at least one URL');
                return;
            }

            // UI Updates
            document.getElementById('scrapeBtn').disabled = true;
            document.getElementById('progress').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            try {
                const response = await fetch('/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls })
                });

                const data = await response.json();

                // Update progress
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('progressText').textContent = `✅ Completed ${data.results.length} pages`;

                // Display results
                displayResults(data);

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('scrapeBtn').disabled = false;
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const listDiv = document.getElementById('resultsList');

            resultsDiv.style.display = 'block';
            listDiv.innerHTML = '';

            // Show append status
            const appendStatus = data.append_status;
            const statusBadge = appendStatus.success ?
                `<span class="status-badge success">✓ ${appendStatus.message}</span>` :
                `<span class="status-badge error">✗ ${appendStatus.message}</span>`;

            listDiv.innerHTML = `<div class="result-item"><strong>Knowledge Base Update:</strong> ${statusBadge}</div>`;

            // Show individual results
            data.results.forEach(result => {
                const div = document.createElement('div');
                div.className = result.error ? 'result-item error' : 'result-item';

                if (result.error) {
                    div.innerHTML = `
                        <div class="result-title">❌ Error</div>
                        <div class="result-meta">${result.url}</div>
                        <div>${result.error}</div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="result-title">✅ ${result.diagnosis}</div>
                        <div class="result-meta">Tier: ${result.tier} | Symptoms: ${result.symptoms.length} | Treatment: ${result.treatment.length}</div>
                    `;
                }

                listDiv.appendChild(div);
            });
        }
    </script>
</body>

</html>
